name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance and Trusted Publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Read once, so the publish steps can branch on it: `secrets` is not usable in
    # a step `if`, `env` is.
    env:
      # Either secret name works: NPM_SECRET is what the repository currently holds.
      NPM_AUTH: ${{ secrets.NPM_SECRET || secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Trusted Publishing needs npm >= 11.5.1. Do not trust whatever version
      # setup-node happens to bundle.
      - run: npm install -g npm@11

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm publish` runs prepublishOnly, which builds and runs the unit tests,
      # so this workflow does not repeat them.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag '$tag' does not match package.json version '$pkg'"
            exit 1
          fi

      # The first publish has no Trusted Publisher yet, because npm only lets you
      # attach one to a package that already exists. Store an automation token as
      # the NPM_TOKEN secret for that publish.
      #
      # The auth line lives in ~/.npmrc rather than setup-node's `registry-url`,
      # which writes `_authToken=${NODE_AUTH_TOKEN}` unconditionally: the OIDC step
      # has no such variable, and npm fails to parse the file when it is missing.
      - name: Publish with the stored token
        if: env.NPM_AUTH != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_AUTH }}
        run: |
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          npm publish --provenance --access public

      # Once the package exists, configure package settings -> Trusted Publisher ->
      # GitHub Actions (this repository, workflow `publish.yml`) and delete the
      # NPM_TOKEN secret. This step then authenticates over OIDC: no long-lived
      # token anywhere, and provenance is signed the same way.
      - name: Publish with Trusted Publishing (OIDC)
        if: env.NPM_AUTH == ''
        run: npm publish --provenance --access public
